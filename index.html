<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expo Stall Feedback</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f7fb;
margin:0;
padding:16px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:18px;
border-radius:14px;
margin-bottom:14px;
box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

h1,h2{
margin-top:0;
}

input,select,textarea{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #d0d5dd;
margin-bottom:10px;
}

textarea{
min-height:70px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr 120px;
gap:10px;
}

@media(max-width:700px){
.row{grid-template-columns:1fr;}
}

.criteria{
border:1px solid #e5e7eb;
padding:10px;
border-radius:10px;
margin-bottom:8px;
}

.choice{
padding:10px 12px;
border:1px solid #ccc;
border-radius:8px;
cursor:pointer;
margin-right:6px;
font-weight:700;
background:white;
}

.choice.active{
background:#e8f0ff;
border-color:#175cd3;
color:#175cd3;
}

.buttons{
margin-top:10px;
display:flex;
flex-wrap:wrap;
gap:8px;
}

button{
padding:10px 14px;
border-radius:8px;
border:none;
font-weight:700;
cursor:pointer;
}

.save{background:#175cd3;color:white;}
.next{background:#10b981;color:white;}
.delete{background:#ef4444;color:white;}
.secondary{background:#f1f5f9;}

.metric{
font-size:22px;
font-weight:800;
}

.listItem{
border:1px solid #e5e7eb;
padding:10px;
border-radius:8px;
margin-bottom:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>Expo Stall Feedback</h1>
<div id="stallCounter">New Stall</div>
</div>

<div class="card">

<div class="row">
<div>
<label>Stall Name</label>
<input id="stallName">
</div>

<div>
<label>Department</label>
<input id="department">
</div>

<div>
<label>Stall No</label>
<input id="stallNo">
</div>
</div>

<label>Team</label>
<input id="team">

<label>Verdict</label>
<select id="verdict">
<option>Excellent</option>
<option>Very Good</option>
<option>Good</option>
<option>Promising</option>
<option>Needs Improvement</option>
</select>

<h3>Point Categories</h3>
<div id="criteria"></div>

<label>Strengths</label>
<textarea id="strengths"></textarea>

<label>Improvements</label>
<textarea id="improvements"></textarea>

<label>Notes</label>
<textarea id="notes"></textarea>

<div class="buttons">
<button class="save" onclick="save(false)">Save</button>
<button class="next" onclick="save(true)">Save & Next</button>
<button class="secondary" onclick="generateRemark()">Generate Remark</button>
<button class="delete" onclick="deleteEntry()">Delete</button>
</div>

</div>

<div class="card">

<h2>Live Summary</h2>

<div>Total Score</div>
<div class="metric"><span id="total">20</span> / 25</div>

<div>Average</div>
<div class="metric"><span id="average">4.0</span> / 5</div>

<label>Formal Remark</label>
<textarea id="remark"></textarea>

<div class="buttons">
<button class="secondary" onclick="exportCSV()">Export CSV</button>
<button class="secondary" onclick="clearAll()">Clear All</button>
</div>

</div>

<div class="card">
<h2>Saved Stalls</h2>
<div id="list"></div>
</div>

</div>

<script>

const storageKey="expo_feedback";
let index=-1;

const criteria=[
["innovation","Innovation"],
["practical","Practical Use"],
["technical","Technical Quality"],
["presentation","Presentation"],
["future","Future Scope"]
];

function buildCriteria(){

const box=document.getElementById("criteria");

criteria.forEach(([key,label])=>{

const div=document.createElement("div");
div.className="criteria";

div.innerHTML=`
<b>${label}</b>
<div id="${key}Row"></div>
`;

box.appendChild(div);

const row=document.getElementById(key+"Row");

for(let i=1;i<=5;i++){

const btn=document.createElement("button");
btn.className="choice"+(i===4?" active":"");
btn.innerText=i;

btn.onclick=()=>setScore(key,i);

row.appendChild(btn);
}

});
}

function setScore(key,val){

document.querySelectorAll("#"+key+"Row .choice").forEach(b=>{
b.classList.remove("active");
if(b.innerText==val)b.classList.add("active");
});

updateSummary();
}

function getScore(key){
const btn=[...document.querySelectorAll("#"+key+"Row .choice")].find(b=>b.classList.contains("active"));
return Number(btn.innerText);
}

function updateSummary(){

let total=0;

criteria.forEach(([key])=>{
total+=getScore(key);
});

document.getElementById("total").innerText=total;
document.getElementById("average").innerText=(total/5).toFixed(1);

}

function getData(){

let data={
stallName:stallName.value,
department:department.value,
stallNo:stallNo.value,
team:team.value,
verdict:verdict.value,
strengths:strengths.value,
improvements:improvements.value,
notes:notes.value,
remark:remark.value,
total:document.getElementById("total").innerText
};

criteria.forEach(([key])=>{
data[key]=getScore(key);
});

return data;
}

function loadEntries(){
return JSON.parse(localStorage.getItem(storageKey)||"[]");
}

function saveEntries(arr){
localStorage.setItem(storageKey,JSON.stringify(arr));
}

function save(next){

let d=getData();

if(!d.stallName){
alert("Enter stall name");
return;
}

let arr=loadEntries();

if(index==-1){
arr.push(d);
index=arr.length-1;
}else{
arr[index]=d;
}

saveEntries(arr);

render();

if(next){
newStall();
}

}

function newStall(){
index=-1;
stallName.value="";
department.value="";
stallNo.value="";
team.value="";
strengths.value="";
improvements.value="";
notes.value="";
remark.value="";
}

function deleteEntry(){

let arr=loadEntries();

if(index==-1)return;

arr.splice(index,1);

saveEntries(arr);

index=-1;

render();

}

function render(){

let arr=loadEntries();

const box=document.getElementById("list");

if(arr.length===0){
box.innerHTML="No saved stalls";
return;
}

box.innerHTML=arr.map((s,i)=>`
<div class="listItem">
<b>${s.stallName}</b>
<br>${s.department}
<button onclick="openEntry(${i})">Open</button>
</div>
`).join("");

}

function openEntry(i){

let arr=loadEntries();

let s=arr[i];

index=i;

stallName.value=s.stallName;
department.value=s.department;
stallNo.value=s.stallNo;
team.value=s.team;
verdict.value=s.verdict;
strengths.value=s.strengths;
improvements.value=s.improvements;
notes.value=s.notes;
remark.value=s.remark;

criteria.forEach(([key])=>{
setScore(key,s[key]);
});

updateSummary();

}

function exportCSV(){

let arr=loadEntries();

if(arr.length==0)return;

let headers=Object.keys(arr[0]).join(",");

let rows=arr.map(o=>Object.values(o).join(",")).join("\\n");

let csv=headers+"\\n"+rows;

let blob=new Blob([csv],{type:"text/csv"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");
a.href=url;
a.download="expo_feedback.csv";
a.click();

}

function clearAll(){
localStorage.removeItem(storageKey);
render();
}

function generateRemark(){

let avg=document.getElementById("average").innerText;

let r="";

if(avg>4.5)r="Excellent project with strong implementation.";
else if(avg>4)r="Very good project with clear concept.";
else if(avg>3)r="Promising project with good potential.";
else r="Sincere effort. Further improvement recommended.";

remark.value=r;

}

buildCriteria();
updateSummary();
render();

</script>

</body>
</html>
