<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expo Judge Pro</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
background:#f4f7fb;
margin:0;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:16px;
box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

h1,h2{
margin-top:0;
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

textarea{min-height:80px}

button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.primary{background:#2563eb;color:white}
.ghost{background:white;border:1px solid #ccc}
.success{background:#16a34a;color:white}
.warn{background:#d97706;color:white}
.danger{background:#dc2626;color:white}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.star{
font-size:26px;
cursor:pointer;
color:#ccc;
}

.star.active{
color:#f59e0b;
}

.criteria{
margin-bottom:12px;
}

.leader{
padding:10px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:8px;
}

.medal{
font-size:20px;
margin-right:6px;
}

.report-page{
page-break-after:always;
}

.bar-wrap{
height:10px;
background:#eef2f7;
border-radius:999px;
overflow:hidden;
}

.bar-fill{
height:100%;
background:#2563eb;
}

</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>Expo Judge Pro</h1>
</div>

<div class="card">

<label>Judge Name</label>
<input id="judgeName">

<label>Panel</label>
<input id="panelName">

<label>Stall Name</label>
<input id="stallName">

<label>Department</label>
<input id="department">

<label>Stall No</label>
<input id="stallNo">

<label>Team</label>
<input id="team">

<h3>Scoring</h3>

<div id="criteria"></div>

<label>Strengths</label>
<textarea id="strengths"></textarea>

<label>Improvements</label>
<textarea id="improvements"></textarea>

<label>Notes</label>
<textarea id="notes"></textarea>

<label>Judge Remark</label>
<textarea id="remark"></textarea>

<div class="buttons">
<button class="primary" onclick="save()">Save</button>
<button class="success" onclick="saveNext()">Save & Next</button>
<button class="ghost" onclick="prev()">Previous</button>
<button class="ghost" onclick="next()">Next</button>
<button class="warn" onclick="markInnovation()">Innovation Candidate</button>
<button class="danger" onclick="deleteEntry()">Delete</button>
</div>

</div>

<div class="card">

<h2>Leaderboard</h2>
<div id="leaderboard"></div>

<h2>Innovation Award</h2>
<div id="innovation"></div>

<h2>Ranking</h2>
<div id="ranking"></div>

<div class="buttons">
<button class="ghost" onclick="exportCSV()">Export CSV</button>
<button class="ghost" onclick="printPDF()">Final PDF</button>
<button class="danger" onclick="clearAll()">Clear All</button>
</div>

</div>

</div>

<script>

const STORAGE_KEY="expo_judge_pro_final";

const criteria=[
["innovation","Innovation"],
["practical","Practical Use"],
["technical","Technical"],
["presentation","Presentation"],
["future","Future Scope"]
];

let currentIndex=-1;

function buildCriteria(){

let box=document.getElementById("criteria");

criteria.forEach(c=>{

let div=document.createElement("div");
div.className="criteria";

let html="<b>"+c[1]+"</b><br>";

for(let i=1;i<=5;i++){

html+=`<span class="star" onclick="setScore('${c[0]}',${i})" id="${c[0]}_${i}">★</span>`;

}

div.innerHTML=html;

box.appendChild(div);

setScore(c[0],4);

});

}

function setScore(name,val){

for(let i=1;i<=5;i++){

let el=document.getElementById(name+"_"+i);

el.classList.toggle("active",i<=val);

}

saveDraft();

}

function getScore(name){

for(let i=5;i>=1;i--){

if(document.getElementById(name+"_"+i).classList.contains("active"))
return i;

}

return 0;

}

function getEntries(){

return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");

}

function saveEntries(data){

localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

}

function collectData(){

let d={

judgeName:judgeName.value,
panelName:panelName.value,
stallName:stallName.value,
department:department.value,
stallNo:stallNo.value,
team:team.value,
strengths:strengths.value,
improvements:improvements.value,
notes:notes.value,
remark:remark.value,
innovation:getScore("innovation"),
practical:getScore("practical"),
technical:getScore("technical"),
presentation:getScore("presentation"),
future:getScore("future")

};

d.total=d.innovation+d.practical+d.technical+d.presentation+d.future;

d.average=(d.total/5).toFixed(1);

return d;

}

function fillForm(d){

judgeName.value=d.judgeName||"";
panelName.value=d.panelName||"";
stallName.value=d.stallName||"";
department.value=d.department||"";
stallNo.value=d.stallNo||"";
team.value=d.team||"";
strengths.value=d.strengths||"";
improvements.value=d.improvements||"";
notes.value=d.notes||"";
remark.value=d.remark||"";

setScore("innovation",d.innovation||4);
setScore("practical",d.practical||4);
setScore("technical",d.technical||4);
setScore("presentation",d.presentation||4);
setScore("future",d.future||4);

}

function save(){

let d=collectData();

if(!d.stallName){

d.stallName=d.stallNo?"Stall "+d.stallNo:"Unnamed Stall";

stallName.value=d.stallName;

}

let entries=getEntries();

if(currentIndex==-1){

entries.push(d);

currentIndex=entries.length-1;

}else{

entries[currentIndex]=d;

}

saveEntries(entries);

render();

}

function saveNext(){

save();

newStall();

}

function newStall(){

currentIndex=-1;

stallName.value="";
department.value="";
stallNo.value="";
team.value="";
strengths.value="";
improvements.value="";
notes.value="";
remark.value="";

criteria.forEach(c=>setScore(c[0],4));

}

function prev(){

let entries=getEntries();

if(entries.length==0)return;

if(currentIndex<=0)currentIndex=0;

else currentIndex--;

fillForm(entries[currentIndex]);

}

function next(){

let entries=getEntries();

if(entries.length==0)return;

if(currentIndex>=entries.length-1)currentIndex=entries.length-1;

else currentIndex++;

fillForm(entries[currentIndex]);

}

function deleteEntry(){

let entries=getEntries();

if(currentIndex==-1)return;

entries.splice(currentIndex,1);

saveEntries(entries);

currentIndex=-1;

newStall();

render();

}

function render(){

let entries=getEntries();

let sorted=[...entries].sort((a,b)=>b.total-a.total);

let lb=document.getElementById("leaderboard");

lb.innerHTML="";

sorted.slice(0,3).forEach((s,i)=>{

let medal=i==0?"🥇":i==1?"🥈":"🥉";

lb.innerHTML+=`<div class="leader">${medal} ${s.stallName} — ${s.total}/25</div>`;

});

let ranking=document.getElementById("ranking");

ranking.innerHTML="";

sorted.forEach((s,i)=>{

ranking.innerHTML+=`<div class="leader">${i+1}. ${s.stallName} — ${s.total}/25</div>`;

});

}

function exportCSV(){

let entries=getEntries();

let csv="Stall,Department,Score\n";

entries.forEach(e=>{

csv+=`${e.stallName},${e.department},${e.total}\n`;

});

let blob=new Blob([csv]);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="expo_scores.csv";

a.click();

}

function printPDF(){

window.print();

}

function clearAll(){

if(confirm("Clear all saved entries?")){

localStorage.removeItem(STORAGE_KEY);

location.reload();

}

}

buildCriteria();

render();

</script>

</body>
</html>
