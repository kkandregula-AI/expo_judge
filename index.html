<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Expo Judge Pro v5</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6fb;
}

.wrap{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
border:1px solid #ddd;
border-radius:12px;
padding:16px;
margin-bottom:16px;
}

button{
padding:10px 14px;
border-radius:8px;
border:none;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.ghost{
background:white;
border:1px solid #ccc;
}

.choice{
padding:8px 12px;
border:1px solid #ccc;
border-radius:8px;
margin-right:6px;
cursor:pointer;
}

.choice.active{
background:#2563eb;
color:white;
}

.print-report{
display:none;
}

/* PRINT LAYOUT */

@media print{

.wrap>.card{
display:none;
}

.print-report{
display:block;
}

.report-page{
page-break-after:always;
padding:20mm;
}

.report-page:last-child{
page-break-after:auto;
}

}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #bbb;
padding:8px;
text-align:left;
}

.bar{
height:12px;
background:#2563eb;
border-radius:6px;
}

.bar-wrap{
background:#eee;
height:12px;
border-radius:6px;
}

.signature{
margin-top:80px;
border-top:1px solid black;
width:260px;
padding-top:8px;
}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h2>Expo Judge Pro</h2>

<label>Stall Name</label>
<input id="stallName" style="width:100%;padding:8px">

<label>Department</label>
<input id="dept" style="width:100%;padding:8px">

<label>Stall No</label>
<input id="stallNo" style="width:100%;padding:8px">

<h3>Scores</h3>

<div id="scores"></div>

<div style="margin-top:10px">
Total: <b id="total">20</b> / 25 |
Average: <b id="avg">4</b> / 5
</div>

<br>

<button class="primary" onclick="save()">Save Stall</button>
<button class="ghost" onclick="exportPDF()">Generate Final PDF</button>

</div>

<div class="card">

<h3>Saved Stalls</h3>

<div id="list"></div>

</div>

<div id="report" class="print-report"></div>

</div>

<script>

const criteria=[
"Innovation",
"Practical",
"Technical",
"Presentation",
"Future"
]

let scores=[4,4,4,4,4]

let data=JSON.parse(localStorage.getItem("expo_judge_v5")||"[]")

function buildScores(){

let html=""

criteria.forEach((c,i)=>{

html+="<div><b>"+c+"</b><br>"

for(let s=1;s<=5;s++){

html+=`<span class="choice ${scores[i]==s?"active":""}" onclick="setScore(${i},${s})">${s}</span>`

}

html+="</div><br>"

})

document.getElementById("scores").innerHTML=html

updateSummary()

}

function setScore(i,v){

scores[i]=v

buildScores()

}

function updateSummary(){

let total=scores.reduce((a,b)=>a+b,0)

document.getElementById("total").innerText=total

document.getElementById("avg").innerText=(total/5).toFixed(1)

}

function save(){

let stall={

name:stallName.value,

dept:dept.value,

stallNo:stallNo.value,

scores:[...scores],

total:scores.reduce((a,b)=>a+b,0)

}

data.push(stall)

localStorage.setItem("expo_judge_v5",JSON.stringify(data))

render()

}

function render(){

let html=""

data.forEach((s,i)=>{

html+=`${i+1}. ${s.name} (${s.total}/25)<br>`

})

document.getElementById("list").innerHTML=html

}

function bar(score){

let pct=(score/5)*100

return `

<div class="bar-wrap">

<div class="bar" style="width:${pct}%"></div>

</div>`

}

function exportPDF(){

let ranked=[...data].sort((a,b)=>b.total-a.total)

let top3=ranked.slice(0,3)

let innovation=[...data].sort((a,b)=>b.scores[0]-a.scores[0])

let innovationWinner=innovation[0]

let report=""

report+=`

<div class="report-page">

<h1>🏆 Top 3 Leaderboard</h1>

<table>

<tr>

<th>Rank</th>

<th>Stall</th>

<th>Department</th>

<th>Score</th>

</tr>

${top3.map((s,i)=>`

<tr>

<td>${i+1}</td>

<td>${s.name}</td>

<td>${s.dept}</td>

<td>${s.total}/25</td>

</tr>`).join("")}

</table>

</div>

`

report+=`

<div class="report-page">

<h1>🎯 Best Innovation Award</h1>

<table>

<tr><td>Winning Stall</td><td>${innovationWinner.name}</td></tr>

<tr><td>Department</td><td>${innovationWinner.dept}</td></tr>

<tr><td>Innovation Score</td><td>${innovationWinner.scores[0]}/5</td></tr>

<tr><td>Total Score</td><td>${innovationWinner.total}/25</td></tr>

</table>

</div>

`

report+=`

<div class="report-page">

<h1>📊 Auto Ranking</h1>

<table>

<tr>

<th>Rank</th>

<th>Stall</th>

<th>Department</th>

<th>Total</th>

</tr>

${ranked.map((s,i)=>`

<tr>

<td>${i+1}</td>

<td>${s.name}</td>

<td>${s.dept}</td>

<td>${s.total}/25</td>

</tr>`).join("")}

</table>

</div>

`

ranked.forEach((s,i)=>{

report+=`

<div class="report-page">

<h2>${i+1}. ${s.name}</h2>

<table>

<tr><td>Department</td><td>${s.dept}</td></tr>

<tr><td>Stall No</td><td>${s.stallNo}</td></tr>

<tr><td>Total</td><td>${s.total}/25</td></tr>

</table>

<h3>Score Breakdown</h3>

${criteria.map((c,j)=>`

<b>${c}</b>

${bar(s.scores[j])}

<br>

`).join("")}

</div>

`

})

report+=`

<div class="report-page">

<h2>Official Judge Approval</h2>

<div class="signature">

Judge Signature

</div>

</div>

`

document.getElementById("report").innerHTML=report

window.print()

}

buildScores()

render()

</script>

</body>

</html>
